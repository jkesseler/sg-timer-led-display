services:
  scoring-app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URI: mongodb://mongo:27017/score-keeping-app

  mongo:
    image: mongo:8
    restart: unless-stopped
    command:
      - --storageEngine=wiredTiger
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The BLE bridge, ESP32 boards and the TV's browser connect from outside Docker.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  mongo-data:
