services:
  scoring-app:
    image: node:24-bookworm-slim
    restart: on-failure
    working_dir: /home/node/app
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URI: mongodb://mongo:27017/score-keeping-app
      # Read by the browser, which runs on the host — not the in-network name.
      MQTT_WS_URL: ws://localhost:9001
      NODE_OPTIONS: --no-deprecation
      WATCHPACK_POLLING: 'true'

  mongo:
    image: mongo:8
    restart: on-failure
    command:
      - --storageEngine=wiredTiger
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Stands in for the external broker in development; the app only knows it
  # through MQTT_WS_URL, and the host-side ble-bridge through MQTT_BROKER_URL.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: on-failure
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  mongo-data:
  node_modules:
